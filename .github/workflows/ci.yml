name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight run for the same ref so we don't pile up CI minutes
# on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Note: ANDROID_HOME / ANDROID_SDK_ROOT are exported to $GITHUB_ENV
# automatically by `android-actions/setup-android@v3`, so we don't need
# to set them at job level (and we can't — `steps.*` isn't valid in
# `env:` at the workflow level).

jobs:
  unit-test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          # Pin to what app/build.gradle.kts asks for (compileSdk = 37,
          # build-tools 35.x is current).
          api-level: 37
          build-tools-version: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Bump this key when build.gradle.kts / libs.versions.toml change
          # to force a fresh dependency resolution.
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          build-tools-version: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Android Lint (debug variant)
        # `continue-on-error: true` so warnings don't block PRs — they
        # still show up in the report artifact.
        run: ./gradlew :app:lintDebug --no-daemon -Dorg.gradle.warning.mode=summary
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14